# Render blueprint: connect the repo at render.com/blueprints and it creates the API.
# The database lives on Neon: Render asks for DATABASE_URL during setup.
# The free API plan sleeps when idle, so the first request takes ~30 s.
# See .ai/context/deployment.md.
services:
  - type: web
    name: vocabulary-os-api
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    # Migrations run in the build step because preDeployCommand needs a paid plan.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @vocab-os/api build && pnpm --filter @vocab-os/api db:deploy
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      - key: JWT_SECRET
        generateValue: true
      # Neon direct (non-pooled) connection string. Render prompts for it.
      - key: DATABASE_URL
        sync: false
