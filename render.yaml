# Render blueprint: connect the repo at render.com/blueprints and it creates the API
# and a Postgres database. Free plans sleep when idle (first request takes ~30 s)
# and the free database expires after 30 days — see .ai/context/deployment.md.
services:
  - type: web
    name: vocabulary-os-api
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    # Migrations run in the build step because preDeployCommand needs a paid plan.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @vocab-os/api build && pnpm --filter @vocab-os/api db:deploy
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vocabulary-os-db
          property: connectionString

databases:
  - name: vocabulary-os-db
    plan: free
    region: singapore
